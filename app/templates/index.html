<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macaquinho faz Tudo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">

<nav class="bg-white shadow p-4 flex justify-between">
    <h1 class="text-xl font-bold">Macaquinho faz Tudo</h1>

    <a href="{{ url_for('login.logout') }}" class="text-red-500">
        Sair
    </a>
</nav>

<main class="max-w-2xl mx-auto p-4">

<!-- 🔥 FORM CRIAR -->
<form method="POST"
      action="{{ url_for('anuncio.criar_anuncio') }}"
      class="bg-white p-4 rounded shadow mb-6">

    <h2 class="font-bold mb-3">Criar Anúncio</h2>

    <input name="titulo" placeholder="Título"
           class="w-full p-2 border mb-2">

    <select name="categoria" class="w-full p-2 border mb-2">
        <option value="1">Reparos</option>
        <option value="2">Educação</option>
        <option value="3">Tecnologia</option>
    </select>

    <textarea name="descricao" placeholder="Descrição"
              class="w-full p-2 border mb-2"></textarea>

    <input name="preco" placeholder="Preço"
           class="w-full p-2 border mb-2">

    <button class="bg-blue-600 text-white px-4 py-2 rounded">
        Publicar
    </button>
</form>

<hr class="my-6">

<!-- 🔥 LISTA -->
{% for anuncio in anuncios %}
<div class="bg-white p-4 rounded shadow mb-3">

    <h2 class="font-bold">{{ anuncio.titulo }}</h2>
    <p>{{ anuncio.descricao }}</p>
    <p class="text-blue-600 font-bold">R$ {{ anuncio.preco }}</p>

    <div class="flex gap-2 mt-3">

        <!-- BOTÃO ATUALIZAR (abre modal) -->
        <button onclick="abrirModal({{ anuncio.id }}, '{{ anuncio.titulo }}', '{{ anuncio.descricao }}', '{{ anuncio.preco }}')"
                class="bg-yellow-500 text-white px-3 py-1 rounded">
            Atualizar
        </button>

        <!-- DELETAR -->
        <form method="POST"
              action="{{ url_for('anuncio.deletar_anuncio', id=anuncio.id) }}">

            <button class="bg-red-500 text-white px-3 py-1 rounded">
                Apagar
            </button>
        </form>

    </div>
</div>
{% endfor %}

</main>

<!-- 🔥 MODAL DE EDIÇÃO -->
<div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">

    <div class="bg-white p-6 rounded shadow w-96">

        <h2 class="text-xl font-bold mb-4">Editar Anúncio</h2>

        <form id="formEditar" method="POST">

            <input id="titulo" name="titulo" class="w-full p-2 border mb-2">
            <textarea id="descricao" name="descricao" class="w-full p-2 border mb-2"></textarea>
            <input id="preco" name="preco" class="w-full p-2 border mb-2">

            <div class="flex justify-between mt-4">

                <button type="submit"
                        class="bg-green-600 text-white px-4 py-2 rounded">
                    Salvar
                </button>

                <button type="button"
                        onclick="fecharModal()"
                        class="bg-gray-400 text-white px-4 py-2 rounded">
                    Cancelar
                </button>

            </div>

        </form>
    </div>
</div>

<!-- 🔥 JS DO MODAL -->
<script>
function abrirModal(id, titulo, descricao, preco) {
    document.getElementById('modal').classList.remove('hidden');

    document.getElementById('titulo').value = titulo;
    document.getElementById('descricao').value = descricao;
    document.getElementById('preco').value = preco;

    document.getElementById('formEditar').action =
        "/anuncio/atualizar/" + id;
}

function fecharModal() {
    document.getElementById('modal').classList.add('hidden');
}
</script>

</body>
</html>
