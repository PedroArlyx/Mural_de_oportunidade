<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - TrampoBairro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121417]">
    </body>

<div class="min-h-screen bg-[#121417] flex items-center justify-center p-4">
    <div class="w-full max-auto max-w-[450px]">

        <div class="bg-[#1a1d21] rounded-2xl shadow-2xl border-t-4 border-blue-600 p-8">

            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-white uppercase tracking-tight">Criar Conta</h1>
                <p class="text-gray-400 mt-2">Junte-se à comunidade do Macaquinho faz Tudo</p>
            </div>

            <form action="/cadastrar" method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5 ml-1">Nome Completo</label>
                    <input type="text" name="nome" required placeholder="Seu nome completo"
                        class="w-full bg-[#24292e] border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition duration-200">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5 ml-1">E-mail</label>
                    <input type="email" name="email" required placeholder="seu@email.com"
                        class="w-full bg-[#24292e] border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition duration-200">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5 ml-1">Senha</label>
                    <input type="password" name="senha" required placeholder="••••••••"
                        class="w-full bg-[#24292e] border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition duration-200">
                </div>
</html>
