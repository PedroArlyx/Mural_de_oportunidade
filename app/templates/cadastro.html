<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Macaquinho Faz Tudo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center p-6">

    <div class="bg-white p-8 rounded-2xl shadow-xl border-t-8 border-blue-600 w-full max-w-md transform transition hover:scale-[1.01]">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-800">Criar Conta</h2>
            <p class="text-gray-500 mt-2">Junte-se ao mural de oportunidades</p>
        </div>

        <form action="{{ url_for('auth_register.realizar_cadastro') }}" method="POST" class="space-y-4">

            <div class="space-y-1">
                <label class="text-sm font-semibold text-gray-600 ml-1">Nome Completo</label>
                <input type="text" name="nome" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                    placeholder="Seu nome">
            </div>

            <div class="space-y-1">
                <label class="text-sm font-semibold text-gray-600 ml-1">E-mail</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                    placeholder="seu@email.com">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-gray-600 ml-1">Bairro</label>
                    <input type="text" name="bairro" required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                        placeholder="Ex: Centro">
                </div>
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-gray-600 ml-1">Cidade</label>
                    <input type="text" name="cidade" required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                        placeholder="Ex: Cajazeiras">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-sm font-semibold text-gray-600 ml-1">Perfil</label>
                <select name="perfil" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    <option value="prestador">Quero oferecer serviços</option>
                    <option value="cliente">Quero contratar serviços</option>
                </select>
            </div>

            <div class="space-y-1">
                <label class="text-sm font-semibold text-gray-600 ml-1">Senha</label>
                <input type="password" name="senha" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                    placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-blue-200 transition-all duration-300 mt-4">
                Finalizar Cadastro
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-600">Já tem uma conta?
                <a href="{{ url_for('login.login') }}" class="text-blue-600 font-bold hover:underline transition-all">Voltar para o Login</a>
            </p>
        </div>
    </div>

</body>
</html>
