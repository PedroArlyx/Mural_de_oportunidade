<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Mural de Oportunidades</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    <div class="main-container">
        
        <div class="login-container">
            <form action="{{ url_for('home.login_usuario') }}" method="POST" class="form">
                <h2 class="container-heading">Login ADMIN</h2>
                <div class="input-field">
                    <input type="text" name="usuario" required>
                    <label>Usuário</label>
                </div>
                <div class="input-field">
                    <input type="password" name="senha" required>
                    <label>Senha</label>
                </div>
                <button type="submit" class="btn">Entrar</button>
                <a href="#" class="link-cadastro">Painel de Controle</a>
            </form>
        </div>

        <div class="login-container">
            <form action="{{ url_for('home.login_usuario') }}" method="POST" class="form">
                <h2 class="container-heading">Login USUÁRIO</h2>
                <div class="input-field">
                    <input type="text" name="usuario" required>
                    <label>Usuário</label>
                </div>
                <div class="input-field">
                    <input type="password" name="senha" required>
                    <label>Senha</label>
                </div>
                <button type="submit" class="btn">Entrar</button>
                <a href="#" class="link-cadastro">Cadastrar novo usuário</a>
            </form>
        </div>

    </div>
</body>
</html>
