<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

<div class="container">
    <div class="login-box">
        <h2>Login</h2>

        <form method="POST">
            <div class="input-group">
                <input type="email" name="email" required>
                <label>Email</label>
            </div>

            <div class="input-group">
                <input type="password" name="senha" required>
                <label>Senha</label>
            </div>

            <div class="radio-group">
                <label>
                    <input type="radio" name="origem" value="usuario" checked> Usuário
                </label>
                <label>
                    <input type="radio" name="origem" value="admin"> Admin
                </label>
            </div>

            <button type="submit">Entrar</button>
        </form>

        <!-- 🔥 BOTÃO PARA REGISTRO -->
        <p class="register-link">
            Não tem conta?
            <a href="{{ url_for('register.register') }}">Criar conta</a>
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash">
                    {% for category, message in messages %}
                        <p class="{{ category }}">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

    </div>
</div>

</body>
</html>
